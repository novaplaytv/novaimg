name: Generar EPG NovaPlay

on:
  schedule:
    # Se ejecuta todos los días a las 04:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout novaimg
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar grabber de iptv-org
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git grabber
          cd epg
          npm install

      - name: Generar Guía (Latam & Deportes)
        run: |
          cd epg
          # Ejecutamos el grabber para los sitios más estables de la región
          # mi.tv y directv.com.ar cubren la mayoría de tus canales
          npm run grab -- --sites=mi.tv,directv.com.ar --output=../epg/guide.xml

      - name: Comprimir y Validar
        run: |
          ls -lh epg/guide.xml
          # Crear versión comprimida para ahorro de datos en la App
          gzip -c epg/guide.xml > epg/guide.xml.gz

      - name: Guardar en repositorio
        run: |
          git config user.name "NovaEPG Bot"
          git config user.email "nova-epg@users.noreply.github.com"
          git add epg/guide.xml epg/guide.xml.gz
          if git diff --cached --quiet; then
            echo "Sin cambios en la programación."
          else
            git commit -m "EPG: Actualización automática de programación"
            git push
          fi
