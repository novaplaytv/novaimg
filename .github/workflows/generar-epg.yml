name: Generar EPG NovaPlay

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout novaimg
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar Dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Optimizar Base de Datos de Búsqueda
        run: python scripts/generar_db_epg.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar grabber de iptv-org
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git grabber
          cd grabber
          npm install

      - name: Generar Guía (Latam & Caribe)
        run: |
          cd grabber
          # Scrapers enfocados 100% en Latinoamérica y el Caribe
          npm run grab -- --sites=mi.tv,gatotv.com,directv.com.ar,reportv.com.ar,programacion.tcc.com.uy,directv.com.uy,tv.movistar.com.pe,tv.movistar.co,siba.com.co,claro.com.co --maxConnections=5 --timeout=60000 --output=../epg/guide.xml

      - name: Comprimir y Validar
        run: |
          ls -lh epg/guide.xml
          gzip -c epg/guide.xml > epg/guide.xml.gz

      - name: Guardar en repositorio
        run: |
          git config user.name "NovaEPG Bot"
          git config user.email "nova-epg@users.noreply.github.com"
          git add epg/guide.xml epg/guide.xml.gz epg-search/epg_db.json
          if git diff --cached --quiet; then
            echo "Sin cambios detectados."
          else
            git commit -m "EPG & Search: Actualización automática"
            git push
          fi
