name: Actualizar EPG TV MAX (Semanal)

on:
  schedule:
    - cron: '0 5 * * *' # Se ejecuta todos los días a las 05:00 UTC (01:00 AM PY)
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script de actualización
        run: python scripts/update_tvmax.py

      - name: Commit y Push
        run: |
          git config user.name "NovaEPG Bot"
          git config user.email "nova-epg@users.noreply.github.com"
          git add epg_notweb/tvmax.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en la programación."
          else
            git commit -m "EPG: Actualización diaria de TV MAX (Semana Actual)"
            git push
          fi
