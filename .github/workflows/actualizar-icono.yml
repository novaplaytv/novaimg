name: Actualizar Icono

on:
  workflow_dispatch:
    inputs:
      canal:
        description: "Número o identificador del canal"
        required: true
        type: string

      imagen_url:
        description: "URL de la nueva imagen"
        required: true
        type: string

permissions:
  contents: write

jobs:

  actualizar-icono:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      - name: Instalar Pillow
        run: |

          python -m pip install --upgrade pip

          pip install Pillow


      - name: Descargar imagen
        run: |

          curl -L \
            "${{ inputs.imagen_url }}" \
            -o /tmp/imagen_original


      - name: Convertir a WEBP
        run: |

          python - <<'PY'

          from PIL import Image
          import os

          entrada = "/tmp/imagen_original"

          canal_original = "${{ inputs.canal }}"

          # Convertir a número y formatear siempre con 3 dígitos.
          # Ejemplos:
          # 1   -> 001
          # 10  -> 010
          # 99  -> 099
          # 100 -> 100

          try:

              canal_numero = int(canal_original)

              canal = f"{canal_numero:03d}"

          except ValueError:

              # Si por alguna razón no es numérico,
              # se mantiene el valor original.

              canal = canal_original


          salida = f"icons/{canal}.webp"


          os.makedirs(
              "icons",
              exist_ok=True
          )


          imagen = Image.open(
              entrada
          )


          if imagen.mode not in (
              "RGB",
              "RGBA"
          ):

              imagen = imagen.convert(
                  "RGBA"
              )


          imagen.thumbnail(
              (512, 512)
          )


          imagen.save(
              salida,
              "WEBP",
              quality=90,
              method=6
          )


          print(
              f"Icono actualizado: {salida}"
          )

          PY


      - name: Mostrar nombre final
        run: |

          CANAL=$(printf "%03d" "${{ inputs.canal }}")

          echo "Canal original: ${{ inputs.canal }}"

          echo "Archivo final: icons/$CANAL.webp"


      - name: Verificar archivo
        run: |

          ls -lh icons/


      - name: Guardar cambios
        run: |

          CANAL=$(printf "%03d" "${{ inputs.canal }}")


          git config user.name "NovaImg Bot"

          git config user.email \
            "novaimg-bot@users.noreply.github.com"


          git add \
            "icons/$CANAL.webp"


          if git diff --cached --quiet; then

            echo "No hay cambios para guardar"

            exit 0

          fi


          git commit \
            -m "Actualizar icono del canal $CANAL"


          git push
