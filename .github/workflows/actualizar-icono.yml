name: Actualizar Icono

on:
  workflow_dispatch:

    inputs:

      canal:
        description: "Archivo real del icono"
        required: true
        type: string

      imagen_url:
        description: "URL de la nueva imagen"
        required: true
        type: string


permissions:
  contents: write


jobs:

  actualizar-icono:

    runs-on: ubuntu-latest


    steps:


      - name: Descargar repositorio
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      - name: Instalar Pillow
        run: |

          python -m pip install --upgrade pip

          pip install Pillow


      - name: Validar archivo del icono
        run: |

          ARCHIVO="${{ inputs.canal }}"

          echo "Archivo solicitado: $ARCHIVO"

          if [[ ! "$ARCHIVO" =~ ^[a-zA-Z0-9_-]+\.webp$ ]]; then

            echo "Nombre de archivo inválido"

            exit 1

          fi


      - name: Descargar imagen
        run: |

          curl \
            --fail \
            --location \
            --retry 3 \
            "${{ inputs.imagen_url }}" \
            -o /tmp/imagen_original


      - name: Convertir a WEBP
        run: |

          python - <<'PY'

          from PIL import Image
          import os

          entrada = "/tmp/imagen_original"

          archivo = "${{ inputs.canal }}"

          salida = os.path.join(
              "icons",
              archivo
          )


          os.makedirs(
              "icons",
              exist_ok=True
          )


          imagen = Image.open(
              entrada
          )


          if imagen.mode not in (
              "RGB",
              "RGBA"
          ):

              imagen = imagen.convert(
                  "RGBA"
              )


          imagen.thumbnail(
              (512, 512)
          )


          imagen.save(
              salida,
              "WEBP",
              quality=90,
              method=6
          )


          print(
              f"Icono actualizado correctamente: {salida}"
          )

          PY


      - name: Verificar archivo
        run: |

          ARCHIVO="${{ inputs.canal }}"

          echo "Archivo generado:"

          ls -lh "icons/$ARCHIVO"

          file "icons/$ARCHIVO"


      - name: Guardar cambios
        run: |

          ARCHIVO="${{ inputs.canal }}"


          git config user.name "NovaImg Bot"

          git config user.email \
            "novaimg-bot@users.noreply.github.com"


          git add \
            "icons/$ARCHIVO"


          if git diff --cached --quiet; then

            echo "No hay cambios para guardar"

            exit 0

          fi


          git commit \
            -m "Actualizar icono $ARCHIVO"


          git push
