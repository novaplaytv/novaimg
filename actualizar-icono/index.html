<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PANEL NOVAIMG - Gestión de Iconos</title>
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #b91c1c;
            --bg: #080a10;
            --card-bg: #11151f;
            --input-bg: #1a1f2e;
            --text: #ffffff;
            --text-muted: #9aa3b2;
            --border: #293246;
            --success: #10b981;
            --error: #ef4444;
            --nav-height: 60px;
        }

        * { box-sizing: border-box; outline: none; }
        html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

        /* Navegación Compacta */
        .nova-nav { position: sticky; top: 0; z-index: 9999; background: rgba(8,10,16,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .nav-inner { max-width: 1300px; margin: auto; height: var(--nav-height); padding: 0 15px; display: flex; align-items: center; justify-content: space-between; }
        .nav-brand { display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; font-weight: 800; font-size: 16px; letter-spacing: -0.5px; }
        .nav-brand img { width: 28px; height: 28px; border-radius: 6px; }

        .nav-links { display: flex; gap: 5px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-links a.active { color: #fff; background: var(--primary); }

        .btn-logout { background: var(--error); color: #fff; border: 0; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12px; display: none; margin-left: 10px; }
        .btn-login-nav { color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; margin-left: 10px; border: 1px solid var(--primary); padding: 6px 12px; border-radius: 8px; }

        /* Header Compacto */
        header { padding: 25px 15px; background: linear-gradient(to bottom, #11151f, var(--bg)); border-bottom: 1px solid var(--border); }
        .header-container { max-width: 1200px; margin: auto; display: flex; justify-content: center; align-items: center; }
        .header-info { display: flex; align-items: center; gap: 12px; }
        .header-info img { width: 44px; height: 44px; border-radius: 10px; box-shadow: 0 0 15px rgba(229,9,20,0.2); }
        .header-text h1 { margin: 0; font-size: 22px; font-weight: 800; }
        .header-text p { margin: 2px 0 0; color: var(--text-muted); font-size: 14px; }

        /* Main Content */
        main { max-width: 1200px; margin: auto; padding: 40px 15px; display: flex; flex-direction: column; align-items: center; }
        .card { width: 100%; max-width: 550px; background: var(--card-bg); border: 1px solid var(--border); padding: 35px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }

        .field { margin-bottom: 24px; }
        label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--text-muted); font-size: 13px; text-transform: uppercase; }
        input, select { width: 100%; background: var(--input-bg); border: 1px solid var(--border); color: #fff; padding: 14px 18px; border-radius: 12px; font-size: 16px; transition: 0.2s; }
        input:focus { border-color: var(--primary); background: #1e2536; }

        .btn-primary { width: 100%; background: var(--primary); color: #fff; border: 0; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-primary:disabled { background: #2d3548; cursor: not-allowed; transform: none; }

        .btn-secondary { width: 100%; background: #2d3548; color: #fff; border: 0; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-secondary:hover { background: #3d465c; }

        /* Preview Area */
        .preview-area { margin-top: 25px; padding: 20px; background: var(--input-bg); border-radius: 16px; border: 2px dashed var(--border); display: none; text-align: center; }
        .preview-area img { max-width: 100%; max-height: 250px; border-radius: 12px; object-fit: contain; }

        /* Status */
        .status { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 14px; font-weight: 600; display: none; line-height: 1.5; text-align: center; }
        .status.success { display: block; background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
        .status.error { display: block; background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

        footer { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border); }

        @media (max-width: 600px) {
            .nav-inner { flex-direction: column; height: auto; padding: 10px; gap: 10px; }
        }
    </style>
</head>
<body>

<nav class="nova-nav">
    <div class="nav-inner">
        <a class="nav-brand" href="https://novaplaytv.github.io/">
            <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp" alt="NovaPlay">
            NOVAPLAY
        </a>
        <div class="nav-links">
            <a href="https://novaplaytv.github.io/">INICIO</a>
            <a href="https://novaplaytv.github.io/DEMO-NOVAPLAY/">DEMO</a>
            <a href="https://novaplaytv.github.io/panel-canales/" id="navPanelCanales" style="display:none;">CANALES</a>
            <a href="#" class="btn-login-nav" id="navLogin">INGRESAR</a>
            <button class="btn-logout" id="navLogout" onclick="cerrarSesion()">SALIR</button>
        </div>
    </div>
</nav>

<header>
    <div class="header-container">
        <div class="header-info">
            <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp" alt="Logo">
            <div class="header-text">
                <h1>Panel de Iconos</h1>
                <p>Gestión profesional de recursos</p>
            </div>
        </div>
    </div>
</header>

<main>
    <!-- LOGIN -->
    <div class="card" id="loginContainer">
        <h2 style="margin-top:0; text-align:center;">Acceso Administrador</h2>
        <div class="field">
            <label>Usuario</label>
            <input id="username" type="text" placeholder="Usuario" autocomplete="username">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="loginButton" onclick="iniciarSesion()">ENTRAR AL PANEL</button>
        <div id="loginStatus" class="status"></div>
    </div>

    <!-- PANEL DE GESTIÓN -->
    <div class="card" id="panel" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
            <h2 style="margin:0;">Actualizar Icono</h2>
            <a href="https://novaplaytv.github.io/novaimg/" class="btn-secondary" style="width:auto; margin:0; padding: 10px 15px; font-weight:800; display:flex; align-items:center; gap:8px;">
                <span>🖼️</span> GALERÍA
            </a>
        </div>

        <div class="field">
            <label>1. Selecciona el Canal</label>
            <select id="canal">
                <option value="">Cargando canales...</option>
            </select>
        </div>

        <div style="margin: 30px 0; height: 1px; background: var(--border); position: relative;">
            <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); padding: 0 15px; color: var(--text-muted); font-size: 11px; font-weight: 800;">OPCIONES DE ORIGEN</span>
        </div>

        <div class="field">
            <label>Opción A: URL Externa</label>
            <input id="imagenUrl" type="url" placeholder="https://..." oninput="limpiarArchivo()">
            <button class="btn-secondary" onclick="verImagenUrl()">PREVISUALIZAR URL</button>
        </div>

        <div class="field">
            <label>Opción B: Subir Archivo</label>
            <input id="imagenArchivo" type="file" accept="image/*" onchange="seleccionarArchivo()">
            <div id="fileName" style="font-size:12px; margin-top:8px; color:var(--primary); font-weight:700; display:none;"></div>
            <button class="btn-secondary" onclick="verImagenArchivo()">PREVISUALIZAR ARCHIVO</button>
        </div>

        <div class="preview-area" id="preview">
            <label>VISTA PREVIA</label>
            <img id="previewImage" src="" alt="Preview">
        </div>

        <button class="btn-primary" id="updateButton" onclick="actualizarIcono()" style="margin-top:30px; background:#fff; color:#000;">
            🚀 APLICAR CAMBIO AHORA
        </button>

        <div id="status" class="status"></div>
    </div>
</main>

<footer>
    <p>© 2026 NOVAPLAY TV - Sistema de Gestión de Activos</p>
    <p>© 2010 - 2026 - MSGT. TODOS LOS DERECHOS RESERVADOS</p>
</footer>

<script>
    const API_URL = "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-icono";
    const CATALOGO_URL = "../index.html";
    const MAX_FILE_SIZE = 25 * 1024 * 1024;
    let sessionToken = localStorage.getItem("novaimg_session_token") || "";

    function mostrarEstado(id, tipo, mensaje) {
        const el = document.getElementById(id);
        el.className = "status " + tipo;
        el.textContent = mensaje;
        el.style.display = "block";
    }

    function ocultarEstado(id) {
        const el = document.getElementById(id);
        el.style.display = "none";
    }

    async function fetchJSON(body, usarSesion = false) {
        const headers = { "Content-Type": "application/json" };
        if (usarSesion && sessionToken) headers.Authorization = "Bearer " + sessionToken;
        try {
            const response = await fetch(API_URL, { method: "POST", headers, body: JSON.stringify(body) });
            const data = await response.json().catch(() => ({ error: "Respuesta inválida del servidor." }));
            return { response, data };
        } catch (e) {
            return { response: { ok: false }, data: { error: "Error de conexión." } };
        }
    }

    async function restaurarSesion() {
        if (!sessionToken) return;
        const { response } = await fetchJSON({ action: "verificar_sesion" }, true);
        if (response.ok) { UI_MostrarPanel(); await cargarCanales(); }
        else { cerrarSesion(); }
    }

    function UI_MostrarPanel() {
        document.getElementById("loginContainer").style.display = "none";
        document.getElementById("panel").style.display = "block";
        document.getElementById("navLogout").style.display = "block";
        document.getElementById("navLogin").style.display = "none";
        document.getElementById("navPanelCanales").style.display = "inline-block";
    }

    async function iniciarSesion() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const btn = document.getElementById("loginButton");
        ocultarEstado("loginStatus");
        if (!username || !password) { mostrarEstado("loginStatus", "error", "Ingresa tus credenciales."); return; }
        btn.disabled = true; btn.textContent = "AUTENTICANDO...";
        const { response, data } = await fetchJSON({ action: "login", username, password });
        if (response.ok && data.token) {
            sessionToken = data.token;
            localStorage.setItem("novaimg_session_token", sessionToken);
            UI_MostrarPanel(); await cargarCanales();
        } else { mostrarEstado("loginStatus", "error", data.error || "Acceso denegado."); }
        btn.disabled = false; btn.textContent = "ENTRAR AL PANEL";
    }

    function cerrarSesion() {
        localStorage.removeItem("novaimg_session_token");
        location.reload();
    }

    async function cargarCanales() {
        const select = document.getElementById("canal");
        select.innerHTML = '<option value="">Cargando canales...</option>';
        try {
            const r = await fetch(CATALOGO_URL, { cache: "no-store" });
            const html = await r.text();
            const doc = new DOMParser().parseFromString(html, "text/html");
            const cards = doc.querySelectorAll(".card");
            select.innerHTML = '<option value="">Selecciona un canal</option>';
            let count = 0;
            cards.forEach(card => {
                const name = card.querySelector("h2")?.textContent?.trim();
                const num = card.querySelector(".channel-number")?.textContent?.replace(/CANAL/gi, "").trim();
                const src = card.querySelector("img")?.getAttribute("src");
                const match = src?.match(/(?:icons\/)([^/?#]+\.webp)/i);
                if (name && num && match) {
                    const opt = document.createElement("option");
                    opt.value = match[1];
                    opt.textContent = `${name} (Canal ${num})`;
                    select.appendChild(opt);
                    count++;
                }
            });
            if (count === 0) select.innerHTML = '<option value="">No hay canales con iconos.</option>';
        } catch (e) { mostrarEstado("status", "error", "Error al leer el catálogo."); }
    }

    function limpiarArchivo() { document.getElementById("imagenArchivo").value = ""; document.getElementById("fileName").style.display = "none"; }

    function seleccionarArchivo() {
        const input = document.getElementById("imagenArchivo");
        const file = input.files?.[0];
        document.getElementById("imagenUrl").value = "";
        if (!file) { document.getElementById("fileName").style.display = "none"; return; }
        if (file.size > MAX_FILE_SIZE) { input.value = ""; mostrarEstado("status", "error", "Supera 25 MB."); return; }
        const nameEl = document.getElementById("fileName");
        nameEl.textContent = `📄 ${file.name}`;
        nameEl.style.display = "block";
    }

    function verImagenUrl() {
        const url = document.getElementById("imagenUrl").value.trim();
        if (!url) return;
        const img = document.getElementById("previewImage");
        img.onload = () => document.getElementById("preview").style.display = "block";
        img.src = url;
    }

    function verImagenArchivo() {
        const file = document.getElementById("imagenArchivo").files?.[0];
        if (!file) return;
        const img = document.getElementById("previewImage");
        img.src = URL.createObjectURL(file);
        document.getElementById("preview").style.display = "block";
    }

    async function actualizarIcono() {
        const canal = document.getElementById("canal").value;
        const url = document.getElementById("imagenUrl").value.trim();
        const file = document.getElementById("imagenArchivo").files?.[0];
        const btn = document.getElementById("updateButton");
        if (!canal) { mostrarEstado("status", "error", "Selecciona canal."); return; }
        btn.disabled = true; btn.textContent = "⚡ PROCESANDO...";
        try {
            let res;
            if (file) {
                const fd = new FormData();
                fd.append("action", "actualizar");
                fd.append("canal", canal);
                fd.append("imagen", file);
                res = await fetch(API_URL, { method: "POST", headers: { "Authorization": "Bearer " + sessionToken }, body: fd });
            } else {
                res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + sessionToken },
                    body: JSON.stringify({ action: "actualizar", canal, imagen_url: url })
                });
            }
            const data = await res.json();
            if (res.ok) mostrarEstado("status", "success", "¡Icono actualizado!");
            else throw new Error(data.error || "Error.");
        } catch (e) { mostrarEstado("status", "error", e.message); }
        btn.disabled = false; btn.textContent = "🚀 APLICAR CAMBIO AHORA";
    }

    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") iniciarSesion(); });
    restaurarSesion();
</script>
</body>
</html>
