<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>PANEL NOVAIMG</title>

<link
    rel="icon"
    type="image/webp"
    href="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
>

<style>

* {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
    display: flex;
    flex-direction: column;
}

.back-button {
    position: fixed;
    top: clamp(10px, 2vw, 20px);
    right: clamp(10px, 2vw, 25px);
    z-index: 9999;
    width: auto;
    min-height: auto;
    margin: 0;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    background: white;
    color: #111827;
    border-radius: 10px;
    font-size: clamp(12px, 2vw, 15px);
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(0,0,0,.18);
    transition: transform .2s ease, background .2s ease;
}

.back-button:hover {
    background: #e5e7eb;
    transform: translateY(-2px);
}

.back-button:active {
    transform: scale(.97);
}

header {
    width: 100%;
    background: #111827;
    color: white;
    padding: clamp(15px, 3vw, 30px) clamp(15px, 5vw, 40px);
}

.header-container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

.header-title {
    display: flex;
    align-items: center;
    gap: clamp(10px, 2vw, 16px);
    min-width: 0;
}

.header-icon {
    width: clamp(40px, 7vw, 60px);
    height: clamp(40px, 7vw, 60px);
    object-fit: contain;
    flex-shrink: 0;
}

.header-text {
    min-width: 0;
}

.header-title h1 {
    margin: 0;
    font-size: clamp(24px, 5vw, 36px);
    line-height: 1.1;
}

.header-title p {
    margin: 6px 0 0;
    font-size: clamp(13px, 2.5vw, 16px);
    opacity: .85;
}

main {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(15px, 3vw, 35px);
}

.container {
    width: 100%;
    max-width: 850px;
}

.login-container {
    width: 100%;
    max-width: 450px;
}

.card {
    width: 100%;
    background: white;
    padding: clamp(18px, 4vw, 30px);
    border-radius: clamp(10px, 2vw, 16px);
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
    overflow: hidden;
}

.panel {
    display: none;
}

h2 {
    margin: 0 0 clamp(20px, 4vw, 30px);
    font-size: clamp(20px, 4vw, 28px);
}

.field {
    width: 100%;
    margin-bottom: clamp(14px, 2vw, 20px);
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: clamp(14px, 2vw, 16px);
}

input,
select {
    width: 100%;
    max-width: 100%;
    padding: clamp(11px, 2vw, 14px);
    font-size: clamp(14px, 2vw, 16px);
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: white;
    color: #111827;
}

input:focus,
select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}

button {
    width: 100%;
    min-height: 48px;
    padding: clamp(12px, 2vw, 15px);
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: clamp(14px, 2vw, 16px);
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.status {
    display: none;
    width: 100%;
    margin-top: clamp(15px, 3vw, 22px);
    padding: clamp(12px, 2vw, 16px);
    border-radius: 8px;
    overflow-wrap: anywhere;
}

.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.preview {
    display: none;
    width: 100%;
    text-align: center;
    margin-top: 20px;
}

.preview img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: min(40dvh, 350px);
    margin: auto;
    object-fit: contain;
    border-radius: 8px;
}

@media (max-width: 600px) {

    main {
        align-items: flex-start;
    }

    .back-button {
        padding: 8px 12px;
        font-size: 12px;
    }

}

@media (max-height: 600px) {

    main {
        align-items: flex-start;
    }

    .preview img {
        max-height: 200px;
    }

}

</style>

</head>

<body>

<a
    href="https://thedarksoldier996.github.io/novaimg"
    class="back-button"
>
    ← Volver
</a>

<header>

<div class="header-container">

<div class="header-title">

<img
    class="header-icon"
    src="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
    alt="NOVAIMG"
>

<div class="header-text">

<h1>NOVAIMG</h1>

<p>Panel de actualización de Iconos</p>

</div>

</div>

</div>

</header>

<main>


<!-- LOGIN -->

<div
    class="login-container"
    id="loginContainer"
>

<div class="card">

<h2>Iniciar sesión</h2>

<div class="field">

<label>Usuario</label>

<input
    id="username"
    type="text"
    autocomplete="username"
>

</div>

<div class="field">

<label>Contraseña</label>

<input
    id="password"
    type="password"
    autocomplete="current-password"
>

</div>

<button
    id="loginButton"
    type="button"
    onclick="iniciarSesion()"
>
    Ingresar
</button>

<div
    id="loginStatus"
    class="status"
></div>

</div>

</div>


<!-- PANEL -->

<div
    class="container panel"
    id="panel"
>

<div class="card">

<h2>Actualizar icono</h2>

<div class="field">

<label>Canal</label>

<select id="canal">

<option value="">
Cargando canales...
</option>

</select>

</div>

<div class="field">

<label>URL de la nueva imagen</label>

<input
    id="imagenUrl"
    type="url"
    placeholder="https://ejemplo.com/logo.png"
>

</div>

<button
    type="button"
    onclick="verImagen()"
>
    Vista previa
</button>

<div
    id="preview"
    class="preview"
>

<img
    id="previewImage"
    alt="Vista previa"
>

</div>

<button
    id="updateButton"
    type="button"
    onclick="actualizarIcono()"
>
    Actualizar icono
</button>

<div
    id="status"
    class="status"
></div>

</div>

</div>

</main>


<script>

const API_URL =
    "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-icono";


let usuario = "";
let password = "";


/* =========================
   UTILIDAD
========================= */

function mostrarError(
    elemento,
    mensaje
) {

    const status =
        document.getElementById(
            elemento
        );

    status.className =
        "status error";

    status.textContent =
        mensaje;

}


/* =========================
   LOGIN
========================= */

async function iniciarSesion() {

    usuario =
        document
        .getElementById("username")
        .value
        .trim();


    password =
        document
        .getElementById("password")
        .value
        .trim();


    const boton =
        document.getElementById(
            "loginButton"
        );


    const status =
        document.getElementById(
            "loginStatus"
        );


    if (!usuario || !password) {

        mostrarError(
            "loginStatus",
            "Completa usuario y contraseña."
        );

        return;

    }


    boton.disabled = true;

    boton.textContent =
        "Verificando...";


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            action: "login",
                            username: usuario,
                            password: password
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Acceso denegado"
            );

        }


        document
            .getElementById(
                "loginContainer"
            )
            .style.display =
                "none";


        document
            .getElementById(
                "panel"
            )
            .style.display =
                "block";


        cargarCanales();


    } catch (error) {

        console.error(error);


        if (
            error.message ===
            "Failed to fetch"
        ) {

            mostrarError(
                "loginStatus",
                "No se pudo conectar con el servidor. Verifica que la Edge Function esté activa."
            );

        } else {

            mostrarError(
                "loginStatus",
                error.message
            );

        }

    } finally {

        boton.disabled = false;

        boton.textContent =
            "Ingresar";

    }

}


/* =========================
   CARGAR CANALES
========================= */

async function cargarCanales() {

    const select =
        document.getElementById(
            "canal"
        );


    try {

        const response =
            await fetch(
                "../index.html"
            );


        if (!response.ok) {

            throw new Error();

        }


        const texto =
            await response.text();


        const parser =
            new DOMParser();


        const documento =
            parser.parseFromString(
                texto,
                "text/html"
            );


        const tarjetas =
            documento.querySelectorAll(
                ".card"
            );


        select.innerHTML =
            '<option value="">Selecciona un canal</option>';


        tarjetas.forEach(
            tarjeta => {

                const nombre =
                    tarjeta
                    .querySelector("h2")
                    ?.textContent
                    ?.trim();


                const numero =
                    tarjeta
                    .querySelector(
                        ".channel-number"
                    )
                    ?.textContent
                    ?.replace(
                        "CANAL",
                        ""
                    )
                    ?.trim();


                if (nombre && numero) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        numero;


                    option.textContent =
                        `${nombre} (${numero})`;


                    select.appendChild(
                        option
                    );

                }

            }
        );


        if (
            select.options.length <= 1
        ) {

            select.innerHTML =
                '<option value="">No se encontraron canales</option>';

        }


    } catch (error) {

        console.error(error);

        select.innerHTML =
            '<option value="">Error cargando canales</option>';

    }

}


/* =========================
   VISTA PREVIA
========================= */

function verImagen() {

    const url =
        document
        .getElementById(
            "imagenUrl"
        )
        .value
        .trim();


    if (!url) {

        alert(
            "Ingresa una URL."
        );

        return;

    }


    document
        .getElementById(
            "previewImage"
        )
        .src =
            url;


    document
        .getElementById(
            "preview"
        )
        .style.display =
            "block";

}


/* =========================
   ACTUALIZAR
========================= */

async function actualizarIcono() {

    const canal =
        document
        .getElementById(
            "canal"
        )
        .value;


    const imagenUrl =
        document
        .getElementById(
            "imagenUrl"
        )
        .value
        .trim();


    const boton =
        document.getElementById(
            "updateButton"
        );


    if (!canal || !imagenUrl) {

        mostrarError(
            "status",
            "Completa todos los campos."
        );

        return;

    }


    boton.disabled = true;

    boton.textContent =
        "Actualizando...";


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            action: "actualizar",
                            username: usuario,
                            password: password,
                            canal: canal,
                            imagen_url: imagenUrl
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Error al actualizar"
            );

        }


        const status =
            document.getElementById(
                "status"
            );


        status.className =
            "status success";


        status.textContent =
            "✓ Actualización iniciada correctamente.";


    } catch (error) {

        console.error(error);


        mostrarError(
            "status",
            error.message ===
            "Failed to fetch"
                ? "No se pudo conectar con el servidor."
                : error.message
        );

    } finally {

        boton.disabled = false;

        boton.textContent =
            "Actualizar icono";

    }

}

</script>

</body>

</html>
