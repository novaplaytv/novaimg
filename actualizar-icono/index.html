<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>PANEL NOVAIMG</title>

<!-- FAVICON -->

<link
    rel="icon"
    type="image/webp"
    href="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        Arial,
        sans-serif;

    background: #f3f4f6;
    color: #111827;

    display: flex;
    flex-direction: column;
}


/* =========================
   HEADER
========================= */

header {
    background: #111827;
    color: white;

    padding:
        clamp(15px, 3vw, 30px)
        clamp(15px, 5vw, 40px);

    width: 100%;
}

.header-container {
    width: 100%;
    max-width: 1100px;

    margin: auto;

    display: flex;
    align-items: center;
}

.header-title {
    display: flex;
    align-items: center;

    gap: clamp(10px, 2vw, 16px);

    min-width: 0;
}

.header-icon {
    width: clamp(40px, 7vw, 60px);
    height: clamp(40px, 7vw, 60px);

    object-fit: contain;

    flex-shrink: 0;
}

.header-text {
    min-width: 0;
}

.header-title h1 {
    margin: 0;

    font-size:
        clamp(24px, 5vw, 36px);

    line-height: 1.1;

    overflow-wrap: anywhere;
}

.header-title p {
    margin:
        clamp(3px, 1vw, 6px)
        0
        0;

    font-size:
        clamp(13px, 2.5vw, 16px);

    opacity: .85;

    overflow-wrap: anywhere;
}


/* =========================
   ÁREA PRINCIPAL
========================= */

main {
    flex: 1;

    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        clamp(15px, 3vw, 35px);
}


/* =========================
   CONTENEDORES
========================= */

.container {
    width: 100%;
    max-width: 850px;
}

.login-container {
    width: 100%;
    max-width: 450px;
}

.card {
    width: 100%;

    background: white;

    padding:
        clamp(18px, 4vw, 30px);

    border-radius:
        clamp(10px, 2vw, 16px);

    box-shadow:
        0 5px 25px rgba(0,0,0,.08);

    overflow: hidden;
}


/* =========================
   PANEL
========================= */

.panel {
    display: none;
}


/* =========================
   TÍTULOS
========================= */

h2 {
    margin:
        0
        0
        clamp(20px, 4vw, 30px);

    font-size:
        clamp(20px, 4vw, 28px);

    overflow-wrap: anywhere;
}


/* =========================
   FORMULARIO
========================= */

.field {
    width: 100%;

    margin-bottom:
        clamp(14px, 2vw, 20px);
}

label {
    display: block;

    font-weight: bold;

    margin-bottom:
        clamp(6px, 1vw, 9px);

    font-size:
        clamp(14px, 2vw, 16px);
}

input,
select {
    width: 100%;
    max-width: 100%;

    padding:
        clamp(11px, 2vw, 14px);

    font-size:
        clamp(14px, 2vw, 16px);

    border:
        1px solid #d1d5db;

    border-radius:
        8px;

    background: white;

    color: #111827;
}

input:focus,
select:focus {
    outline: none;

    border-color: #2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.15);
}


/* =========================
   BOTONES
========================= */

button {
    width: 100%;

    min-height: 48px;

    padding:
        clamp(12px, 2vw, 15px);

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size:
        clamp(14px, 2vw, 16px);

    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;

    transition:
        background .2s ease,
        transform .1s ease;
}

button:hover {
    background: #1d4ed8;
}

button:active {
    transform: scale(.98);
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}


/* =========================
   MENSAJES
========================= */

.status {
    display: none;

    width: 100%;

    margin-top:
        clamp(15px, 3vw, 22px);

    padding:
        clamp(12px, 2vw, 16px);

    border-radius: 8px;

    font-size:
        clamp(13px, 2vw, 15px);

    overflow-wrap: anywhere;
}

.success {
    display: block;

    background: #dcfce7;

    color: #166534;
}

.error {
    display: block;

    background: #fee2e2;

    color: #991b1b;
}


/* =========================
   VISTA PREVIA
========================= */

.preview {
    display: none;

    width: 100%;

    text-align: center;

    margin-top:
        clamp(15px, 3vw, 25px);

    margin-bottom:
        clamp(5px, 2vw, 15px);
}

.preview img {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;

    max-height:
        min(40dvh, 350px);

    margin: auto;

    object-fit: contain;

    border-radius: 8px;
}


/* =========================
   TABLETS Y CELULARES
========================= */

@media (max-width: 600px) {

    main {
        align-items: flex-start;
    }

    .header-container {
        justify-content: flex-start;
    }

    .card {
        border-radius: 12px;
    }

}


/* =========================
   PANTALLAS MUY PEQUEÑAS
========================= */

@media (max-width: 360px) {

    header {
        padding: 12px;
    }

    main {
        padding: 10px;
    }

    .card {
        padding: 15px;
    }

    .header-title {
        gap: 8px;
    }

}


/* =========================
   PANTALLAS ALTAS
========================= */

@media (min-height: 800px) {

    main {
        align-items: center;
    }

}


/* =========================
   PANTALLAS BAJAS
========================= */

@media (max-height: 600px) {

    main {
        align-items: flex-start;
        padding-top: 15px;
        padding-bottom: 15px;
    }

    .preview img {
        max-height: 200px;
    }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div class="header-container">

<div class="header-title">

<img
    class="header-icon"
    src="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
    alt="NOVAIMG"
>

<div class="header-text">

<h1>NOVAIMG</h1>

<p>
Panel de actualización de Iconos
</p>

</div>

</div>

</div>

</header>


<!-- =========================
     CONTENIDO PRINCIPAL
========================= -->

<main>


<!-- LOGIN -->

<div
    class="login-container"
    id="loginContainer"
>

<div class="card">

<h2>Iniciar sesión</h2>


<div class="field">

<label>Usuario</label>

<input
    id="username"
    type="text"
    autocomplete="username"
>

</div>


<div class="field">

<label>Contraseña</label>

<input
    id="password"
    type="password"
    autocomplete="current-password"
>

</div>


<button
    type="button"
    onclick="iniciarSesion()"
>

Ingresar

</button>


<div
    id="loginStatus"
    class="status"
></div>

</div>

</div>


<!-- PANEL -->

<div
    class="container panel"
    id="panel"
>

<div class="card">

<h2>Actualizar icono</h2>


<div class="field">

<label>Canal</label>

<select id="canal">

<option value="">
Cargando canales...
</option>

</select>

</div>


<div class="field">

<label>URL de la nueva imagen</label>

<input
    id="imagenUrl"
    type="url"
    placeholder="https://ejemplo.com/logo.png"
>

</div>


<button
    type="button"
    onclick="verImagen()"
>

Vista previa

</button>


<div
    id="preview"
    class="preview"
>

<img
    id="previewImage"
    alt="Vista previa"
>

</div>


<button
    type="button"
    onclick="actualizarIcono()"
>

Actualizar icono

</button>


<div
    id="status"
    class="status"
></div>

</div>

</div>


</main>


<script>

const API_URL =
    "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-icono";


let usuario = "";
let password = "";


/* =========================
   LOGIN
========================= */

async function iniciarSesion() {

    usuario =
        document
        .getElementById("username")
        .value
        .trim();


    password =
        document
        .getElementById("password")
        .value
        .trim();


    const status =
        document.getElementById("loginStatus");


    if (!usuario || !password) {

        status.className =
            "status error";

        status.textContent =
            "Completa usuario y contraseña.";

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            action: "login",
                            username: usuario,
                            password: password
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Acceso denegado"
            );

        }


        document
            .getElementById("loginContainer")
            .style.display =
                "none";


        document
            .getElementById("panel")
            .style.display =
                "block";


        cargarCanales();


    } catch (error) {

        status.className =
            "status error";

        status.textContent =
            error.message;

    }

}


/* =========================
   CARGAR CANALES
========================= */

async function cargarCanales() {

    const select =
        document.getElementById("canal");


    try {

        const response =
            await fetch("../index.html");


        const texto =
            await response.text();


        const parser =
            new DOMParser();


        const documento =
            parser.parseFromString(
                texto,
                "text/html"
            );


        const tarjetas =
            documento.querySelectorAll(
                ".card"
            );


        select.innerHTML =
            '<option value="">Selecciona un canal</option>';


        tarjetas.forEach(
            tarjeta => {

                const nombre =
                    tarjeta
                    .querySelector("h2")
                    ?.textContent
                    ?.trim();


                const numero =
                    tarjeta
                    .querySelector(".channel-number")
                    ?.textContent
                    ?.replace("CANAL", "")
                    ?.trim();


                if (nombre && numero) {

                    const option =
                        document.createElement("option");


                    option.value =
                        numero;


                    option.textContent =
                        `${nombre} (${numero})`;


                    select.appendChild(option);

                }

            }
        );


    } catch (error) {

        console.error(error);

        select.innerHTML =
            '<option>Error cargando canales</option>';

    }

}


/* =========================
   VISTA PREVIA
========================= */

function verImagen() {

    const url =
        document
        .getElementById("imagenUrl")
        .value
        .trim();


    if (!url) {

        alert("Ingresa una URL.");

        return;

    }


    const imagen =
        document.getElementById(
            "previewImage"
        );


    imagen.src =
        url;


    document
        .getElementById("preview")
        .style.display =
            "block";

}


/* =========================
   ACTUALIZAR ICONO
========================= */

async function actualizarIcono() {

    const canal =
        document
        .getElementById("canal")
        .value;


    const imagenUrl =
        document
        .getElementById("imagenUrl")
        .value
        .trim();


    const status =
        document.getElementById("status");


    if (!canal || !imagenUrl) {

        status.className =
            "status error";

        status.textContent =
            "Completa todos los campos.";

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            action: "actualizar",
                            username: usuario,
                            password: password,
                            canal: canal,
                            imagen_url: imagenUrl
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Error"
            );

        }


        status.className =
            "status success";

        status.textContent =
            "✓ Actualización iniciada correctamente.";


    } catch (error) {

        status.className =
            "status error";

        status.textContent =
            error.message;

    }

}

</script>

</body>
</html>
