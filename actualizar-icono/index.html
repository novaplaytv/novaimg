<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>PANEL NOVAIMG</title>

<link
    rel="icon"
    type="image/webp"
    href="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
    display: flex;
    flex-direction: column;
}

header {
    width: 100%;
    background: #111827;
    color: white;
    padding: clamp(15px, 3vw, 30px);
}

.header-container {
    max-width: 1100px;
    margin: auto;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-icon {
    width: clamp(42px, 7vw, 60px);
    height: clamp(42px, 7vw, 60px);
    object-fit: contain;
}

.header-title h1 {
    margin: 0;
    font-size: clamp(24px, 5vw, 36px);
}

.header-title p {
    margin: 5px 0 0;
    opacity: .8;
}

.top-actions {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 9999;
    display: flex;
    gap: 8px;
}

.top-button {
    width: auto;
    min-height: auto;
    margin: 0;
    padding: 10px 14px;
    background: white;
    color: #111827;
    font-size: 13px;
    box-shadow: 0 4px 15px rgba(0,0,0,.18);
}

.logout-button {
    display: none;
    background: #dc2626;
    color: white;
}

.logout-button:hover {
    background: #b91c1c;
}

main {
    flex: 1;
    width: 100%;
    padding: clamp(15px, 3vw, 35px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.container {
    width: 100%;
    max-width: 850px;
}

.login-container {
    max-width: 450px;
    margin-top: 30px;
}

.card {
    background: white;
    padding: clamp(18px, 4vw, 30px);
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.panel {
    display: none;
}

h2 {
    margin-top: 0;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}

button {
    width: 100%;
    min-height: 48px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.separator {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 25px 0;
    color: #6b7280;
}

.separator::before,
.separator::after {
    content: "";
    height: 1px;
    flex: 1;
    background: #d1d5db;
}

.status {
    display: none;
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
    overflow-wrap: anywhere;
}

.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.preview {
    display: none;
    margin-top: 20px;
    text-align: center;
}

.preview img {
    max-width: 100%;
    max-height: 350px;
    object-fit: contain;
    border-radius: 10px;
}

.file-info {
    margin-top: 8px;
    font-size: 13px;
    color: #6b7280;
}

.mode-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.mode-button {
    margin: 0;
}

.mode-button.active {
    background: #1d4ed8;
}

.source-section {
    display: none;
}

.source-section.active {
    display: block;
}

@media (max-width: 600px) {

    .top-actions {
        top: 8px;
        right: 8px;
    }

    .top-button {
        padding: 8px 10px;
        font-size: 12px;
    }

    .mode-buttons {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<div class="top-actions">

<a
    href="https://thedarksoldier996.github.io/novaimg"
    class="top-button"
>
← Volver
</a>

<button
    id="logoutButton"
    class="top-button logout-button"
    type="button"
    onclick="cerrarSesion()"
>
Cerrar sesión
</button>

</div>


<header>

<div class="header-container">

<div class="header-title">

<img
    class="header-icon"
    src="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
    alt="NOVAIMG"
>

<div>

<h1>NOVAIMG</h1>

<p>Panel de actualización de iconos</p>

</div>

</div>

</div>

</header>


<main>


<!-- LOGIN -->

<div
    class="container login-container"
    id="loginContainer"
>

<div class="card">

<h2>Iniciar sesión</h2>

<div class="field">

<label for="username">
Usuario
</label>

<input
    id="username"
    type="text"
    autocomplete="username"
>

</div>


<div class="field">

<label for="password">
Contraseña
</label>

<input
    id="password"
    type="password"
    autocomplete="current-password"
>

</div>


<button
    id="loginButton"
    type="button"
    onclick="iniciarSesion()"
>
Ingresar
</button>


<div
    id="loginStatus"
    class="status"
></div>

</div>

</div>


<!-- PANEL -->

<div
    class="container panel"
    id="panel"
>

<div class="card">

<h2>Actualizar icono</h2>


<div class="field">

<label for="canal">
Canal
</label>

<select id="canal">

<option value="">
Cargando canales...
</option>

</select>

</div>


<label>
Origen de la imagen
</label>

<div class="mode-buttons">

<button
    id="urlModeButton"
    class="mode-button active"
    type="button"
    onclick="cambiarModo('url')"
>
Usar URL
</button>

<button
    id="fileModeButton"
    class="mode-button"
    type="button"
    onclick="cambiarModo('file')"
>
Subir archivo
</button>

</div>


<!-- URL -->

<div
    id="urlSection"
    class="source-section active"
>

<div class="field">

<label for="imagenUrl">
URL de la imagen
</label>

<input
    id="imagenUrl"
    type="url"
    placeholder="https://ejemplo.com/logo.png"
    oninput="limpiarArchivo()"
>

</div>

</div>


<!-- ARCHIVO -->

<div
    id="fileSection"
    class="source-section"
>

<div class="field">

<label for="imagenFile">
Seleccionar imagen
</label>

<input
    id="imagenFile"
    type="file"
    accept="image/*"
    onchange="seleccionarArchivo()"
>

<div
    id="fileInfo"
    class="file-info"
></div>

</div>

</div>


<button
    type="button"
    onclick="verImagen()"
>
Vista previa
</button>


<div
    id="preview"
    class="preview"
>

<img
    id="previewImage"
    alt="Vista previa"
>

</div>


<button
    id="updateButton"
    type="button"
    onclick="actualizarIcono()"
>
Actualizar icono
</button>


<div
    id="status"
    class="status"
></div>

</div>

</div>

</main>


<script>

/* =========================
   CONFIGURACIÓN
========================= */

const API_URL =
    "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-icono";

const CATALOGO_URL =
    "../index.html";

const SESSION_KEY =
    "novaimg_session_token";


let sessionToken =
    localStorage.getItem(
        SESSION_KEY
    ) || "";


let modoActual =
    "url";


let archivoSeleccionado =
    null;


/* =========================
   INICIO
========================= */

window.addEventListener(
    "DOMContentLoaded",
    async () => {

        if (sessionToken) {

            mostrarPanel();

            await cargarCanales();

        }

    }
);


/* =========================
   UTILIDADES
========================= */

function mostrarEstado(
    tipo,
    mensaje
) {

    const status =
        document.getElementById(
            "status"
        );

    status.className =
        `status ${tipo}`;

    status.textContent =
        mensaje;

}


function mostrarLoginError(
    mensaje
) {

    const status =
        document.getElementById(
            "loginStatus"
        );

    status.className =
        "status error";

    status.textContent =
        mensaje;

}


function mostrarPanel() {

    document
        .getElementById(
            "loginContainer"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "panel"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "logoutButton"
        )
        .style.display =
        "block";

}


/* =========================
   LOGIN
========================= */

async function iniciarSesion() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const boton =
        document.getElementById(
            "loginButton"
        );


    if (!username || !password) {

        mostrarLoginError(
            "Completa usuario y contraseña."
        );

        return;

    }


    boton.disabled = true;

    boton.textContent =
        "Verificando...";


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login",

                            username:
                                username,

                            password:
                                password

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Acceso denegado"
            );

        }


        if (!data.token) {

            throw new Error(
                "El servidor no devolvió un token de sesión."
            );

        }


        sessionToken =
            data.token;


        localStorage.setItem(
            SESSION_KEY,
            sessionToken
        );


        mostrarPanel();

        await cargarCanales();


    } catch (error) {

        mostrarLoginError(
            error.message ||
            "No se pudo iniciar sesión."
        );

    } finally {

        boton.disabled = false;

        boton.textContent =
            "Ingresar";

    }

}


/* =========================
   CERRAR SESIÓN
========================= */

function cerrarSesion() {

    const confirmar =
        confirm(
            "¿Deseas cerrar sesión?"
        );


    if (!confirmar) {

        return;

    }


    localStorage.removeItem(
        SESSION_KEY
    );


    sessionToken = "";


    archivoSeleccionado =
        null;


    document
        .getElementById(
            "panel"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "loginContainer"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "logoutButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "password"
        )
        .value =
        "";


    document
        .getElementById(
            "status"
        )
        .className =
        "status";

}


/* =========================
   CARGAR CANALES
========================= */

async function cargarCanales() {

    const select =
        document.getElementById(
            "canal"
        );


    select.innerHTML =
        '<option value="">Cargando canales...</option>';


    try {

        const response =
            await fetch(
                CATALOGO_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "No se pudo cargar el catálogo."
            );

        }


        const texto =
            await response.text();


        const parser =
            new DOMParser();


        const documento =
            parser.parseFromString(
                texto,
                "text/html"
            );


        const tarjetas =
            documento.querySelectorAll(
                ".card"
            );


        select.innerHTML =
            '<option value="">Selecciona un canal</option>';


        let encontrados =
            0;


        tarjetas.forEach(
            tarjeta => {

                const nombre =
                    tarjeta
                    .querySelector("h2")
                    ?.textContent
                    ?.trim();


                const numero =
                    tarjeta
                    .querySelector(
                        ".channel-number"
                    )
                    ?.textContent
                    ?.replace(
                        /CANAL/gi,
                        ""
                    )
                    ?.trim();


                const imagen =
                    tarjeta.querySelector(
                        "img"
                    );


                const rutaIcono =
                    imagen
                    ?.getAttribute(
                        "src"
                    );


                if (
                    !nombre ||
                    !numero ||
                    !rutaIcono
                ) {

                    return;

                }


                const coincidencia =
                    rutaIcono.match(
                        /icons\/([^/?#]+\.webp)/i
                    );


                if (!coincidencia) {

                    return;

                }


                const archivoIcono =
                    coincidencia[1];


                const option =
                    document.createElement(
                        "option"
                    );


                /*
                El valor es el archivo real.

                Ejemplo:

                008.webp
                */

                option.value =
                    archivoIcono;


                option.textContent =
                    `${nombre} (Canal ${numero})`;


                select.appendChild(
                    option
                );


                encontrados++;

            }
        );


        if (!encontrados) {

            select.innerHTML =
                '<option value="">No se encontraron canales</option>';

        }


    } catch (error) {

        console.error(error);

        select.innerHTML =
            '<option value="">Error cargando canales</option>';

        mostrarEstado(
            "error",
            "No se pudo cargar el catálogo."
        );

    }

}


/* =========================
   CAMBIAR MODO
========================= */

function cambiarModo(
    modo
) {

    modoActual =
        modo;


    document
        .getElementById(
            "urlSection"
        )
        .classList.toggle(
            "active",
            modo === "url"
        );


    document
        .getElementById(
            "fileSection"
        )
        .classList.toggle(
            "active",
            modo === "file"
        );


    document
        .getElementById(
            "urlModeButton"
        )
        .classList.toggle(
            "active",
            modo === "url"
        );


    document
        .getElementById(
            "fileModeButton"
        )
        .classList.toggle(
            "active",
            modo === "file"
        );

}


/* =========================
   ARCHIVO
========================= */

function seleccionarArchivo() {

    const input =
        document.getElementById(
            "imagenFile"
        );


    archivoSeleccionado =
        input.files[0] || null;


    const info =
        document.getElementById(
            "fileInfo"
        );


    if (!archivoSeleccionado) {

        info.textContent =
            "";

        return;

    }


    if (
        !archivoSeleccionado.type.startsWith(
            "image/"
        )
    ) {

        info.textContent =
            "El archivo seleccionado no es una imagen.";

        archivoSeleccionado =
            null;

        return;

    }


    info.textContent =
        `${archivoSeleccionado.name} · ${Math.round(archivoSeleccionado.size / 1024)} KB`;

}


function limpiarArchivo() {

    archivoSeleccionado =
        null;

}


/* =========================
   VISTA PREVIA
========================= */

function verImagen() {

    const imagen =
        document.getElementById(
            "previewImage"
        );


    const preview =
        document.getElementById(
            "preview"
        );


    if (modoActual === "url") {

        const url =
            document
            .getElementById(
                "imagenUrl"
            )
            .value
            .trim();


        if (!url) {

            alert(
                "Ingresa una URL."
            );

            return;

        }


        imagen.src =
            url;

    }


    if (modoActual === "file") {

        if (!archivoSeleccionado) {

            alert(
                "Selecciona una imagen."
            );

            return;

        }


        imagen.src =
            URL.createObjectURL(
                archivoSeleccionado
            );

    }


    preview.style.display =
        "block";

}


/* =========================
   CONVERTIR ARCHIVO A BASE64
========================= */

function archivoABase64(
    archivo
) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => {

                    const resultado =
                        String(
                            reader.result
                        );


                    const base64 =
                        resultado.split(
                            ","
                        )[1];


                    resolve(
                        base64
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                archivo
            );

        }
    );

}


/* =========================
   ACTUALIZAR
========================= */

async function actualizarIcono() {

    const archivoIcono =
        document
        .getElementById(
            "canal"
        )
        .value;


    const boton =
        document.getElementById(
            "updateButton"
        );


    if (!archivoIcono) {

        mostrarEstado(
            "error",
            "Selecciona un canal."
        );

        return;

    }


    let imagenUrl =
        "";

    let archivoBase64 =
        "";

    let archivoNombre =
        "";

    let archivoTipo =
        "";


    if (modoActual === "url") {

        imagenUrl =
            document
            .getElementById(
                "imagenUrl"
            )
            .value
            .trim();


        if (!imagenUrl) {

            mostrarEstado(
                "error",
                "Ingresa la URL de la imagen."
            );

            return;

        }

    }


    if (modoActual === "file") {

        if (!archivoSeleccionado) {

            mostrarEstado(
                "error",
                "Selecciona una imagen desde tu dispositivo."
            );

            return;

        }


        /*
        Límite recomendado.

        Las imágenes grandes se deben
        reducir antes de enviarlas.
        */

        if (
            archivoSeleccionado.size >
            25 * 1024 * 1024
        ) {

            mostrarEstado(
                "error",
                "La imagen es demasiado grande. Máximo 5 MB."
            );

            return;

        }


        archivoBase64 =
            await archivoABase64(
                archivoSeleccionado
            );


        archivoNombre =
            archivoSeleccionado.name;


        archivoTipo =
            archivoSeleccionado.type;

    }


    boton.disabled =
        true;

    boton.textContent =
        "Actualizando...";


    mostrarEstado(
        "success",
        "Procesando actualización..."
    );


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${sessionToken}`

                    },

                    body:
                        JSON.stringify({

                            action:
                                "actualizar",

                            canal:
                                archivoIcono,

                            imagen_url:
                                imagenUrl,

                            archivo_base64:
                                archivoBase64,

                            archivo_nombre:
                                archivoNombre,

                            archivo_tipo:
                                archivoTipo

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            if (
                response.status === 401
            ) {

                cerrarSesion();

            }


            throw new Error(
                data.error ||
                "Error al actualizar."
            );

        }


        mostrarEstado(
            "success",
            data.message ||
            "✓ Actualización iniciada correctamente."
        );


        document
            .getElementById(
                "imagenUrl"
            )
            .value =
            "";


        document
            .getElementById(
                "imagenFile"
            )
            .value =
            "";


        document
            .getElementById(
                "fileInfo"
            )
            .textContent =
            "";


        archivoSeleccionado =
            null;


    } catch (error) {

        mostrarEstado(
            "error",
            error.message ||
            "No se pudo actualizar."
        );

    } finally {

        boton.disabled =
            false;

        boton.textContent =
            "Actualizar icono";

    }

}

</script>

</body>
</html>
