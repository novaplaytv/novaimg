<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>PANEL NOVAIMG</title>

<link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">

<style>

* {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
    display: flex;
    flex-direction: column;
}

.back-button {
    position: fixed;
    top: clamp(10px, 2vw, 20px);
    right: clamp(10px, 2vw, 25px);
    z-index: 9999;
    width: auto;
    min-height: auto;
    margin: 0;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    background: white;
    color: #111827;
    border-radius: 10px;
    font-size: clamp(12px, 2vw, 15px);
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(0,0,0,.18);
}

.back-button:hover {
    background: #e5e7eb;
}

header {
    width: 100%;
    background: #111827;
    color: white;
    padding: clamp(15px, 3vw, 30px) clamp(15px, 5vw, 40px);
}

.header-container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

.header-title {
    display: flex;
    align-items: center;
    gap: clamp(10px, 2vw, 16px);
}

.header-icon {
    width: clamp(40px, 7vw, 60px);
    height: clamp(40px, 7vw, 60px);
    object-fit: contain;
    flex-shrink: 0;
}

.header-text {
    min-width: 0;
}

.header-title h1 {
    margin: 0;
    font-size: clamp(24px, 5vw, 36px);
    line-height: 1.1;
}

.header-title p {
    margin: 6px 0 0;
    font-size: clamp(13px, 2.5vw, 16px);
    opacity: .85;
}

main {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(15px, 3vw, 35px);
}

.container {
    width: 100%;
    max-width: 850px;
}

.login-container {
    width: 100%;
    max-width: 450px;
}

.card {
    width: 100%;
    background: white;
    padding: clamp(18px, 4vw, 30px);
    border-radius: clamp(10px, 2vw, 16px);
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.panel {
    display: none;
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.panel-header h2 {
    margin: 0;
}

.logout-button {
    width: auto;
    min-height: 40px;
    margin: 0;
    padding: 10px 16px;
    background: #dc2626;
}

.logout-button:hover {
    background: #b91c1c;
}

h2 {
    margin: 0 0 clamp(20px, 4vw, 30px);
    font-size: clamp(20px, 4vw, 28px);
}

.field {
    width: 100%;
    margin-bottom: clamp(14px, 2vw, 20px);
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: clamp(14px, 2vw, 16px);
}

input,
select {
    width: 100%;
    max-width: 100%;
    padding: clamp(11px, 2vw, 14px);
    font-size: clamp(14px, 2vw, 16px);
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: white;
    color: #111827;
}

input:focus,
select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}

button {
    width: 100%;
    min-height: 48px;
    padding: clamp(12px, 2vw, 15px);
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: clamp(14px, 2vw, 16px);
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.status {
    display: none;
    width: 100%;
    margin-top: clamp(15px, 3vw, 22px);
    padding: clamp(12px, 2vw, 16px);
    border-radius: 8px;
    overflow-wrap: anywhere;
}

.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.preview {
    display: none;
    width: 100%;
    text-align: center;
    margin-top: 20px;
}

.preview img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: min(40dvh, 350px);
    margin: auto;
    object-fit: contain;
    border-radius: 8px;
}

.divider {
    border: 0;
    border-top: 1px solid #e5e7eb;
    margin: 25px 0;
}

.upload-info {
    font-size: 13px;
    color: #6b7280;
    margin-top: 7px;
}

.file-name {
    display: none;
    margin-top: 8px;
    font-size: 14px;
    color: #2563eb;
    font-weight: bold;
    overflow-wrap: anywhere;
}

@media (max-width: 600px) {

    main {
        align-items: flex-start;
    }

    .back-button {
        padding: 8px 12px;
        font-size: 12px;
    }

    .panel-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .logout-button {
        width: 100%;
    }

}

</style>

</style>

<body>
<nav class="nova-global-nav"><div class="nova-global-nav-inner"><a class="nova-global-brand" href="https://novaplaytv.github.io/"><img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp" alt="NOVAPLAY">NOVAPLAY</a><a href="https://novaplaytv.github.io/" class="">INICIO</a><a href="https://novaplaytv.github.io/novaimg/" class="active">NOVAIMG</a><a href="https://novaplaytv.github.io/DEMO-NOVAPLAY/" class="">DEMO</a><a href="https://novaplaytv.github.io/panel-canales/" class=" panel-link">PANEL CANALES</a><a href="https://novaplaytv.github.io/novaimg/actualizar-icono/" class="panel-link">PANEL IMÁGENES</a></div></nav>





<header>

<div class="header-container">

<div class="header-title">

<img
    class="header-icon"
    src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp"
    alt="NOVAIMG"
>

<div class="header-text">

<h1>NOVAIMG</h1>

<p>Panel de actualización de iconos</p>

</div>

</div>

</div>

</header>


<main>


<!-- =========================
     LOGIN
========================= -->

<div
    class="login-container"
    id="loginContainer"
>

<div class="card">

<h2>Iniciar sesión</h2>


<div class="field">

<label for="username">
Usuario
</label>

<input
    id="username"
    type="text"
    autocomplete="username"
>

</div>


<div class="field">

<label for="password">
Contraseña
</label>

<input
    id="password"
    type="password"
    autocomplete="current-password"
>

</div>


<button
    id="loginButton"
    type="button"
    onclick="iniciarSesion()"
>
    Ingresar
</button>


<div
    id="loginStatus"
    class="status"
></div>

</div>

</div>



<!-- =========================
     PANEL
========================= -->

<div
    class="container panel"
    id="panel"
>

<div class="card">


<div class="panel-header">

<h2>Actualizar icono</h2>

<button
    class="logout-button"
    type="button"
    onclick="cerrarSesion()"
>
    Cerrar sesión
</button>

</div>


<div class="field">

<label for="canal">
Canal
</label>

<select id="canal">

<option value="">
Cargando canales...
</option>

</select>

</div>


<hr class="divider">


<!-- =========================
     URL
========================= -->

<div class="field">

<label for="imagenUrl">
URL de la nueva imagen
</label>

<input
    id="imagenUrl"
    type="url"
    placeholder="https://ejemplo.com/logo.png"
    oninput="limpiarArchivo()"
>

</div>


<button
    type="button"
    onclick="verImagenUrl()"
>
    Vista previa de URL
</button>


<hr class="divider">


<!-- =========================
     ARCHIVO LOCAL
========================= -->

<div class="field">

<label for="imagenArchivo">
O subir imagen desde el dispositivo
</label>

<input
    id="imagenArchivo"
    type="file"
    accept="image/*"
    onchange="seleccionarArchivo()"
>

<div class="upload-info">
Máximo permitido: 25 MB
</div>

<div
    id="fileName"
    class="file-name"
></div>

</div>


<button
    type="button"
    onclick="verImagenArchivo()"
>
    Vista previa del archivo
</button>


<div
    id="preview"
    class="preview"
>

<img
    id="previewImage"
    alt="Vista previa"
>

</div>


<button
    id="updateButton"
    type="button"
    onclick="actualizarIcono()"
>
    Actualizar icono
</button>


<div
    id="status"
    class="status"
></div>


</div>

</div>


</main>


<script>


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const API_URL =
    "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-icono";


const CATALOGO_URL =
    "../index.html";


const MAX_FILE_SIZE =
    25 * 1024 * 1024;


/* =====================================================
   SESIÓN
===================================================== */

let sessionToken =
    localStorage.getItem(
        "novaimg_session_token"
    ) || "";


/* =====================================================
   UTILIDAD
===================================================== */

function mostrarEstado(
    elemento,
    tipo,
    mensaje
) {

    const status =
        document.getElementById(
            elemento
        );

    status.className =
        "status " + tipo;

    status.textContent =
        mensaje;

}


function ocultarEstado(
    elemento
) {

    const status =
        document.getElementById(
            elemento
        );

    status.className =
        "status";

    status.textContent =
        "";

}


function obtenerMensajeError(
    data,
    fallback
) {

    let mensaje =
        data?.error ||
        fallback;


    /*
    Mostrar exactamente qué Secret falta.
    */

    if (
        data?.configuracion
    ) {

        const faltantes =
            Object.entries(
                data.configuracion
            )
            .filter(
                ([, valor]) =>
                    valor === false
            )
            .map(
                ([nombre]) =>
                    nombre
            );


        if (
            faltantes.length > 0
        ) {

            mensaje +=
                " Falta configurar: " +
                faltantes.join(", ");

        }

    }


    return mensaje;

}


/* =====================================================
   PETICIÓN JSON
===================================================== */

async function fetchJSON(
    body,
    usarSesion = false
) {

    const headers = {
        "Content-Type":
            "application/json"
    };


    if (
        usarSesion &&
        sessionToken
    ) {

        headers.Authorization =
            "Bearer " +
            sessionToken;

    }


    const response =
        await fetch(
            API_URL,
            {
                method: "POST",
                headers,
                body:
                    JSON.stringify(body)
            }
        );


    let data = {};

    try {

        data =
            await response.json();

    } catch {

        data = {
            error:
                "El servidor devolvió una respuesta inválida."
        };

    }


    return {
        response,
        data
    };

}


/* =====================================================
   RESTAURAR SESIÓN
===================================================== */

async function restaurarSesion() {

    if (
        !sessionToken
    ) {
        return;
    }


    try {

        const {
            response
        } =
            await fetchJSON(
                {
                    action:
                        "verificar_sesion"
                },
                true
            );


        if (
            !response.ok
        ) {

            throw new Error();

        }


        document
            .getElementById(
                "loginContainer"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "panel"
            )
            .style.display =
            "block";


        await cargarCanales();


    } catch {

        localStorage.removeItem(
            "novaimg_session_token"
        );

        sessionToken = "";

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function iniciarSesion() {

    const username =
        document
        .getElementById(
            "username"
        )
        .value
        .trim();


    const password =
        document
        .getElementById(
            "password"
        )
        .value
        .trim();


    const boton =
        document.getElementById(
            "loginButton"
        );


    ocultarEstado(
        "loginStatus"
    );


    if (
        !username ||
        !password
    ) {

        mostrarEstado(
            "loginStatus",
            "error",
            "Completa usuario y contraseña."
        );

        return;

    }


    boton.disabled = true;

    boton.textContent =
        "Verificando...";


    try {

        const {
            response,
            data
        } =
            await fetchJSON(
                {
                    action:
                        "login",

                    username,

                    password
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                obtenerMensajeError(
                    data,
                    "Acceso denegado."
                )
            );

        }


        if (
            !data.token
        ) {

            throw new Error(
                "El servidor no devolvió un token de sesión."
            );

        }


        sessionToken =
            data.token;


        /*
        Guardar sesión.
        */

        localStorage.setItem(
            "novaimg_session_token",
            sessionToken
        );


        /*
        Limpiar contraseña del navegador.
        */

        document
            .getElementById(
                "password"
            )
            .value =
            "";


        document
            .getElementById(
                "loginContainer"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "panel"
            )
            .style.display =
            "block";


        await cargarCanales();


    } catch (error) {

        console.error(
            error
        );


        mostrarEstado(
            "loginStatus",
            "error",

            error.message ===
            "Failed to fetch"

                ? "No se pudo conectar con el servidor."

                : error.message
        );

    } finally {

        boton.disabled = false;

        boton.textContent =
            "Ingresar";

    }

}


/* =====================================================
   CERRAR SESIÓN
===================================================== */

function cerrarSesion() {

    localStorage.removeItem(
        "novaimg_session_token"
    );


    sessionToken = "";


    document
        .getElementById(
            "panel"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "loginContainer"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "username"
        )
        .value =
        "";


    document
        .getElementById(
            "password"
        )
        .value =
        "";


    ocultarEstado(
        "status"
    );

}


/* =====================================================
   CARGAR CANALES
===================================================== */

async function cargarCanales() {

    const select =
        document.getElementById(
            "canal"
        );


    select.innerHTML =
        '<option value="">Cargando canales...</option>';


    try {

        const response =
            await fetch(
                CATALOGO_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "No se pudo cargar el catálogo."
            );

        }


        const texto =
            await response.text();


        const parser =
            new DOMParser();


        const documento =
            parser.parseFromString(
                texto,
                "text/html"
            );


        const tarjetas =
            documento.querySelectorAll(
                ".card"
            );


        select.innerHTML =
            '<option value="">Selecciona un canal</option>';


        let encontrados =
            0;


        tarjetas.forEach(
            tarjeta => {


                const nombre =
                    tarjeta
                    .querySelector(
                        "h2"
                    )
                    ?.textContent
                    ?.trim();


                const elementoNumero =
                    tarjeta.querySelector(
                        ".channel-number"
                    );


                const numero =
                    elementoNumero
                    ?.textContent
                    ?.replace(
                        /CANAL/gi,
                        ""
                    )
                    ?.trim();


                const imagen =
                    tarjeta.querySelector(
                        "img"
                    );


                const rutaIcono =
                    imagen
                    ?.getAttribute(
                        "src"
                    );


                if (
                    !nombre ||
                    !numero ||
                    !rutaIcono
                ) {
                    return;
                }


                /*
                Busca el archivo real:

                icons/001.webp
                icons/008.webp
                */

                const coincidencia =
                    rutaIcono.match(
                        /(?:icons\/)([^/?#]+\.webp)/i
                    );


                if (
                    !coincidencia
                ) {
                    return;
                }


                const archivoIcono =
                    coincidencia[1];


                const option =
                    document.createElement(
                        "option"
                    );


                /*
                Se utiliza el archivo real.
                Ejemplo: 008.webp
                */

                option.value =
                    archivoIcono;


                option.textContent =
                    `${nombre} (Canal ${numero})`;


                select.appendChild(
                    option
                );


                encontrados++;

            }
        );


        if (
            encontrados === 0
        ) {

            select.innerHTML =
                '<option value="">No se encontraron canales con iconos</option>';

        }


    } catch (error) {

        console.error(
            error
        );


        select.innerHTML =
            '<option value="">Error cargando canales</option>';


        mostrarEstado(
            "status",
            "error",
            "No se pudo leer el catálogo de canales."
        );

    }

}


/* =====================================================
   URL
===================================================== */

function limpiarArchivo() {

    const archivo =
        document.getElementById(
            "imagenArchivo"
        );


    archivo.value =
        "";


    document
        .getElementById(
            "fileName"
        )
        .style.display =
        "none";

}


function verImagenUrl() {

    const url =
        document
        .getElementById(
            "imagenUrl"
        )
        .value
        .trim();


    if (!url) {

        mostrarEstado(
            "status",
            "error",
            "Ingresa una URL de imagen."
        );

        return;

    }


    const imagen =
        document.getElementById(
            "previewImage"
        );


    imagen.onload =
        () => {

            document
                .getElementById(
                    "preview"
                )
                .style.display =
                "block";

        };


    imagen.onerror =
        () => {

            mostrarEstado(
                "status",
                "error",
                "No se pudo cargar la imagen desde esa URL."
            );

        };


    imagen.src =
        url;

}


/* =====================================================
   ARCHIVO LOCAL
===================================================== */

function seleccionarArchivo() {

    const input =
        document.getElementById(
            "imagenArchivo"
        );


    const archivo =
        input.files?.[0];


    const nombre =
        document.getElementById(
            "fileName"
        );


    /*
    Limpiar URL.
    */

    document
        .getElementById(
            "imagenUrl"
        )
        .value =
        "";


    if (!archivo) {

        nombre.style.display =
            "none";

        return;

    }


    if (
        archivo.size >
        MAX_FILE_SIZE
    ) {

        input.value =
            "";


        nombre.style.display =
            "none";


        mostrarEstado(
            "status",
            "error",
            "La imagen supera el límite máximo de 25 MB."
        );

        return;

    }


    nombre.textContent =
        `${archivo.name} · ${(archivo.size / 1024 / 1024).toFixed(2)} MB`;


    nombre.style.display =
        "block";

}


function verImagenArchivo() {

    const input =
        document.getElementById(
            "imagenArchivo"
        );


    const archivo = input.files?.[0];


    if (!archivo) {

        mostrarEstado(
            "status",
            "error",
            "Selecciona una imagen desde el dispositivo."
        );

        return;

    }


    if (
        archivo.size >
        MAX_FILE_SIZE
    ) {

        mostrarEstado(
            "status",
            "error",
            "La imagen supera el límite máximo de 25 MB."
        );

        return;

    }


    if (
        !archivo.type.startsWith(
            "image/"
        )
    ) {

        mostrarEstado(
            "status",
            "error",
            "El archivo seleccionado no es una imagen."
        );

        return;

    }


    const url =
        URL.createObjectURL(
            archivo
        );


    const imagen =
        document.getElementById(
            "previewImage"
        );


    imagen.src =
        url;


    document
        .getElementById(
            "preview"
        )
        .style.display =
        "block";

}


/* =====================================================
   ACTUALIZAR ICONO
===================================================== */

async function actualizarIcono() {

    const archivoIcono =
        document
        .getElementById(
            "canal"
        )
        .value;


    const imagenUrl =
        document
        .getElementById(
            "imagenUrl"
        )
        .value
        .trim();


    const archivo =
        document
        .getElementById(
            "imagenArchivo"
        )
        .files?.[0];


    const boton =
        document.getElementById(
            "updateButton"
        );


    ocultarEstado(
        "status"
    );


    if (
        !archivoIcono
    ) {

        mostrarEstado(
            "status",
            "error",
            "Selecciona un canal."
        );

        return;

    }


    if (
        !imagenUrl &&
        !archivo
    ) {

        mostrarEstado(
            "status",
            "error",
            "Ingresa una URL o selecciona una imagen."
        );

        return;

    }


    if (
        archivo &&
        archivo.size >
        MAX_FILE_SIZE
    ) {

        mostrarEstado(
            "status",
            "error",
            "La imagen supera el límite máximo de 25 MB."
        );

        return;

    }


    boton.disabled =
        true;


    boton.textContent =
        "Actualizando...";


    try {

        let response;
        let data;


        /*
        ================================================
        ARCHIVO LOCAL
        ================================================
        */

        if (archivo) {

            const formData =
                new FormData();


            formData.append(
                "action",
                "actualizar"
            );


            formData.append(
                "canal",
                archivoIcono
            );


            formData.append(
                "imagen",
                archivo
            );


            response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers: {

                            "Authorization":
                                "Bearer " +
                                sessionToken

                        },

                        body:
                            formData

                    }
                );

        }


        /*
        ================================================
        URL
        ================================================
        */

        else {

            response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                sessionToken

                        },

                        body:
                            JSON.stringify({

                                action:
                                    "actualizar",

                                canal:
                                    archivoIcono,

                                imagen_url:
                                    imagenUrl

                            })

                    }
                );

        }


        try {

            data =
                await response.json();

        } catch {

            data = {
                error:
                    "El servidor devolvió una respuesta inválida."
            };

        }


        if (
            !response.ok
        ) {

            if (
                response.status ===
                401
            ) {

                localStorage.removeItem(
                    "novaimg_session_token"
                );

                sessionToken = "";

            }


            throw new Error(
                obtenerMensajeError(
                    data,
                    "Error al actualizar."
                )
            );

        }


        mostrarEstado(
            "status",
            "success",
            data.message ||
            "Actualización iniciada correctamente."
        );


        /*
        Limpiar campos.
        */

        document
            .getElementById(
                "imagenUrl"
            )
            .value =
            "";


        document
            .getElementById(
                "imagenArchivo"
            )
            .value =
            "";


        document
            .getElementById(
                "fileName"
            )
            .style.display =
            "none";


    } catch (error) {

        console.error(
            error
        );


        mostrarEstado(
            "status",
            "error",

            error.message ===
            "Failed to fetch"

                ? "No se pudo conectar con el servidor."

                : error.message
        );

    } finally {

        boton.disabled =
            false;


        boton.textContent =
            "Actualizar icono";

    }

}
