<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>PANEL NOVAIMG</title>

<link
    rel="icon"
    type="image/webp"
    href="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        Arial,
        sans-serif;

    background: #f3f4f6;
    color: #111827;

    display: flex;
    flex-direction: column;
}


/* =========================
   BOTONES SUPERIORES
========================= */

.top-actions {
    position: fixed;

    top: clamp(10px, 2vw, 20px);
    right: clamp(10px, 2vw, 25px);

    z-index: 9999;

    display: flex;
    gap: 10px;
}


.top-button {
    width: auto;
    min-height: auto;

    margin: 0;
    padding: 10px 15px;

    border: none;
    border-radius: 10px;

    background: white;
    color: #111827;

    font-size: 14px;
    font-weight: bold;

    text-decoration: none;

    cursor: pointer;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.18);
}


.top-button:hover {
    background: #e5e7eb;
}


.logout-button {
    display: none;

    background: #dc2626;
    color: white;
}


.logout-button:hover {
    background: #b91c1c;
}


/* =========================
   HEADER
========================= */

header {
    width: 100%;

    background: #111827;
    color: white;

    padding:
        clamp(18px, 3vw, 30px)
        clamp(15px, 5vw, 40px);
}


.header-container {
    width: 100%;
    max-width: 1100px;

    margin: auto;
}


.header-title {
    display: flex;
    align-items: center;

    gap:
        clamp(10px, 2vw, 16px);
}


.header-icon {
    width:
        clamp(42px, 7vw, 60px);

    height:
        clamp(42px, 7vw, 60px);

    object-fit: contain;
    flex-shrink: 0;
}


.header-text h1 {
    margin: 0;

    font-size:
        clamp(25px, 5vw, 36px);
}


.header-text p {
    margin: 6px 0 0;

    font-size:
        clamp(13px, 2.5vw, 16px);

    opacity: .85;
}


/* =========================
   CONTENIDO
========================= */

main {
    flex: 1;

    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        clamp(15px, 3vw, 35px);
}


.container {
    width: 100%;
    max-width: 850px;
}


.login-container {
    width: 100%;
    max-width: 450px;
}


.card {
    width: 100%;

    background: white;

    padding:
        clamp(18px, 4vw, 30px);

    border-radius:
        clamp(10px, 2vw, 16px);

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.08);
}


.panel {
    display: none;
}


h2 {
    margin:
        0
        0
        clamp(20px, 4vw, 30px);

    font-size:
        clamp(20px, 4vw, 28px);
}


/* =========================
   FORMULARIOS
========================= */

.field {
    width: 100%;

    margin-bottom:
        clamp(14px, 2vw, 20px);
}


label {
    display: block;

    font-weight: bold;

    margin-bottom: 8px;
}


input,
select {
    width: 100%;

    padding:
        clamp(11px, 2vw, 14px);

    font-size:
        clamp(14px, 2vw, 16px);

    border:
        1px solid #d1d5db;

    border-radius: 8px;

    background: white;
}


input:focus,
select:focus {
    outline: none;

    border-color: #2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.15);
}


button {
    width: 100%;

    min-height: 48px;

    margin-top: 10px;

    padding:
        clamp(12px, 2vw, 15px);

    border: none;
    border-radius: 8px;

    background: #2563eb;
    color: white;

    font-size:
        clamp(14px, 2vw, 16px);

    font-weight: bold;

    cursor: pointer;
}


button:hover {
    background: #1d4ed8;
}


button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}


/* =========================
   MÉTODO DE IMAGEN
========================= */

.method-buttons {
    display: flex;
    gap: 10px;

    margin-bottom: 20px;
}


.method-button {
    margin: 0;
}


.method-button.active {
    background: #1d4ed8;
}


/* =========================
   ESTADO
========================= */

.status {
    display: none;

    width: 100%;

    margin-top: 20px;

    padding: 14px;

    border-radius: 8px;

    overflow-wrap: anywhere;
}


.success {
    display: block;

    background: #dcfce7;
    color: #166534;
}


.error {
    display: block;

    background: #fee2e2;
    color: #991b1b;
}


.info {
    display: block;

    background: #dbeafe;
    color: #1e40af;
}


/* =========================
   PREVIEW
========================= */

.preview {
    display: none;

    width: 100%;

    text-align: center;

    margin-top: 20px;
}


.preview img {
    display: block;

    max-width: 100%;
    max-height: min(40dvh, 350px);

    margin: auto;

    object-fit: contain;

    border-radius: 8px;

    border:
        1px solid #e5e7eb;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    main {
        align-items: flex-start;
    }

    .top-actions {
        gap: 6px;
    }

    .top-button {
        padding: 8px 10px;
        font-size: 12px;
    }

    .method-buttons {
        flex-direction: column;
    }

}

</style>

</head>

<body>


<!-- =========================
     BOTONES
========================= -->

<div class="top-actions">

<a
    href="https://thedarksoldier996.github.io/novaimg"
    class="top-button"
>
    ← Volver
</a>

<button
    id="logoutButton"
    class="top-button logout-button"
    type="button"
    onclick="cerrarSesion()"
>
    Cerrar sesión
</button>

</div>


<!-- =========================
     HEADER
========================= -->

<header>

<div class="header-container">

<div class="header-title">

<img
    class="header-icon"
    src="https://raw.githubusercontent.com/ThedarkSoldier996/novaimg/main/novasplash.webp"
    alt="NOVAIMG"
>

<div class="header-text">

<h1>NOVAIMG</h1>

<p>
Panel de actualización de iconos
</p>

</div>

</div>

</div>

</header>


<!-- =========================
     CONTENIDO
========================= -->

<main>


<!-- LOGIN -->

<div
    class="login-container"
    id="loginContainer"
>

<div class="card">

<h2>Iniciar sesión</h2>


<div class="field">

<label for="username">
Usuario
</label>

<input
    id="username"
    type="text"
    autocomplete="username"
>

</div>


<div class="field">

<label for="password">
Contraseña
</label>

<input
    id="password"
    type="password"
    autocomplete="current-password"
>

</div>


<button
    id="loginButton"
    type="button"
    onclick="iniciarSesion()"
>
    Ingresar
</button>


<div
    id="loginStatus"
    class="status"
></div>

</div>

</div>


<!-- PANEL -->

<div
    class="container panel"
    id="panel"
>

<div class="card">

<h2>Actualizar icono</h2>


<!-- CANAL -->

<div class="field">

<label for="canal">
Canal
</label>

<select id="canal">

<option value="">
Cargando canales...
</option>

</select>

</div>


<!-- MÉTODO -->

<div class="field">

<label>
Origen de la imagen
</label>

<div class="method-buttons">

<button
    id="urlMethodButton"
    class="method-button active"
    type="button"
    onclick="cambiarMetodo('url')"
>
    Usar URL
</button>


<button
    id="fileMethodButton"
    class="method-button"
    type="button"
    onclick="cambiarMetodo('file')"
>
    Subir archivo
</button>

</div>

</div>


<!-- URL -->

<div
    id="urlContainer"
    class="field"
>

<label for="imagenUrl">
URL de la nueva imagen
</label>

<input
    id="imagenUrl"
    type="url"
    placeholder="https://ejemplo.com/logo.png"
>

</div>


<!-- ARCHIVO -->

<div
    id="fileContainer"
    class="field"
    style="display:none;"
>

<label for="imagenArchivo">
Seleccionar imagen
</label>

<input
    id="imagenArchivo"
    type="file"
    accept="image/*"
    onchange="seleccionarArchivo()"
>

<p
    id="fileInfo"
    style="font-size:13px;color:#6b7280;margin-top:8px;"
>
    Máximo 25 MB
</p>

</div>


<button
    type="button"
    onclick="verImagen()"
>
    Vista previa
</button>


<!-- PREVIEW -->

<div
    id="preview"
    class="preview"
>

<img
    id="previewImage"
    alt="Vista previa"
>

</div>


<!-- ACTUALIZAR -->

<button
    id="updateButton"
    type="button"
    onclick="actualizarIcono()"
>
    Actualizar icono
</button>


<div
    id="status"
    class="status"
></div>

</div>

</div>

</main>


<script>


/* =========================
   CONFIGURACIÓN
========================= */

const API_URL =
    "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-icono";


const CATALOGO_URL =
    "../index.html";


const MAX_FILE_SIZE =
    25 * 1024 * 1024;


/* =========================
   VARIABLES
========================= */

let sessionToken = "";

let modoActual = "url";

let archivoSeleccionado = null;

let previewObjectUrl = null;


/* =========================
   UTILIDAD ESTADO
========================= */

function mostrarEstado(
    tipo,
    mensaje
) {

    const status =
        document.getElementById(
            "status"
        );

    status.className =
        "status " + tipo;

    status.textContent =
        mensaje;

}


/* =========================
   LOGIN
========================= */

async function iniciarSesion() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value
        .trim();


    const loginStatus =
        document.getElementById(
            "loginStatus"
        );


    const boton =
        document.getElementById(
            "loginButton"
        );


    if (!username || !password) {

        loginStatus.className =
            "status error";

        loginStatus.textContent =
            "Completa usuario y contraseña.";

        return;

    }


    boton.disabled = true;

    boton.textContent =
        "Verificando...";


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login",

                            username:
                                username,

                            password:
                                password

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Acceso denegado."
            );

        }


        if (!data.token) {

            throw new Error(
                "El servidor no devolvió un token de sesión."
            );

        }


        sessionToken =
            data.token;


        /*
        GUARDAR SESIÓN
        */

        localStorage.setItem(
            "novaimg_session",
            sessionToken
        );


        mostrarPanel();


    } catch (error) {

        console.error(error);


        loginStatus.className =
            "status error";


        loginStatus.textContent =
            error.message === "Failed to fetch"
                ? "No se pudo conectar con el servidor."
                : error.message;

    } finally {

        boton.disabled = false;

        boton.textContent =
            "Ingresar";

    }

}


/* =========================
   RESTAURAR SESIÓN
========================= */

async function verificarSesionGuardada() {

    const token =
        localStorage.getItem(
            "novaimg_session"
        );


    if (!token) {
        return;
    }


    sessionToken =
        token;


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${sessionToken}`

                    },

                    body:
                        JSON.stringify({

                            action:
                                "verificar_sesion"

                        })

                }
            );


        if (!response.ok) {

            localStorage.removeItem(
                "novaimg_session"
            );

            sessionToken = "";

            return;

        }


        mostrarPanel();


    } catch (error) {

        console.error(
            "No se pudo verificar la sesión:",
            error
        );

    }

}


/* =========================
   MOSTRAR PANEL
========================= */

async function mostrarPanel() {

    document
        .getElementById(
            "loginContainer"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "panel"
        )
        .style.display =
            "block";


    document
        .getElementById(
            "logoutButton"
        )
        .style.display =
            "block";


    await cargarCanales();

}


/* =========================
   CERRAR SESIÓN
========================= */

function cerrarSesion() {

    localStorage.removeItem(
        "novaimg_session"
    );


    sessionToken = "";


    archivoSeleccionado = null;


    document
        .getElementById(
            "loginContainer"
        )
        .style.display =
            "block";


    document
        .getElementById(
            "panel"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "logoutButton"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "password"
        )
        .value =
            "";


    document
        .getElementById(
            "loginStatus"
        )
        .className =
            "status";


    document
        .getElementById(
            "status"
        )
        .className =
            "status";

}


/* =========================
   CARGAR CANALES
========================= */

async function cargarCanales() {

    const select =
        document.getElementById(
            "canal"
        );


    select.innerHTML =
        '<option value="">Cargando canales...</option>';


    try {

        const response =
            await fetch(
                CATALOGO_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "No se pudo cargar el catálogo."
            );

        }


        const texto =
            await response.text();


        const parser =
            new DOMParser();


        const documento =
            parser.parseFromString(
                texto,
                "text/html"
            );


        const tarjetas =
            documento.querySelectorAll(
                ".card"
            );


        select.innerHTML =
            '<option value="">Selecciona un canal</option>';


        let encontrados = 0;


        tarjetas.forEach(
            tarjeta => {

                const nombre =
                    tarjeta
                    .querySelector("h2")
                    ?.textContent
                    ?.trim();


                const elementoNumero =
                    tarjeta.querySelector(
                        ".channel-number"
                    );


                const numero =
                    elementoNumero
                    ?.textContent
                    ?.replace(
                        /CANAL/gi,
                        ""
                    )
                    ?.trim();


                const imagen =
                    tarjeta.querySelector(
                        "img"
                    );


                const rutaIcono =
                    imagen
                    ?.getAttribute(
                        "src"
                    );


                if (
                    !nombre ||
                    !numero ||
                    !rutaIcono
                ) {
                    return;
                }


                const coincidencia =
                    rutaIcono.match(
                        /icons\/([^/?#]+\.webp)/i
                    );


                if (!coincidencia) {
                    return;
                }


                const archivoIcono =
                    coincidencia[1];


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    archivoIcono;


                option.textContent =
                    `${nombre} (Canal ${numero})`;


                select.appendChild(
                    option
                );


                encontrados++;

            }
        );


        if (encontrados === 0) {

            select.innerHTML =
                '<option value="">No se encontraron canales</option>';

        }


    } catch (error) {

        console.error(error);


        select.innerHTML =
            '<option value="">Error cargando canales</option>';


        mostrarEstado(
            "error",
            "No se pudo leer el catálogo."
        );

    }

}


/* =========================
   CAMBIAR MÉTODO
========================= */

function cambiarMetodo(
    metodo
) {

    modoActual =
        metodo;


    document
        .getElementById(
            "urlContainer"
        )
        .style.display =
            metodo === "url"
                ? "block"
                : "none";


    document
        .getElementById(
            "fileContainer"
        )
        .style.display =
            metodo === "file"
                ? "block"
                : "none";


    document
        .getElementById(
            "urlMethodButton"
        )
        .classList.toggle(
            "active",
            metodo === "url"
        );


    document
        .getElementById(
            "fileMethodButton"
        )
        .classList.toggle(
            "active",
            metodo === "file"
        );


    document
        .getElementById(
            "preview"
        )
        .style.display =
            "none";

}


/* =========================
   SELECCIONAR ARCHIVO
========================= */

function seleccionarArchivo() {

    const input =
        document.getElementById(
            "imagenArchivo"
        );


    const archivo =
        input.files[0];


    if (!archivo) {

        archivoSeleccionado = null;

        return;

    }


    if (
        archivo.size >
        MAX_FILE_SIZE
    ) {

        input.value = "";

        archivoSeleccionado = null;


        mostrarEstado(
            "error",
            "La imagen supera el límite máximo de 25 MB."
        );

        return;

    }


    if (
        !archivo.type.startsWith(
            "image/"
        )
    ) {

        input.value = "";

        archivoSeleccionado = null;


        mostrarEstado(
            "error",
            "El archivo seleccionado no es una imagen."
        );

        return;

    }


    archivoSeleccionado =
        archivo;


    const tamañoMB =
        (
            archivo.size /
            1024 /
            1024
        )
        .toFixed(2);


    document
        .getElementById(
            "fileInfo"
        )
        .textContent =
            `${archivo.name} — ${tamañoMB} MB`;

}


/* =========================
   VISTA PREVIA
========================= */

function verImagen() {

    const preview =
        document.getElementById(
            "preview"
        );


    const imagen =
        document.getElementById(
            "previewImage"
        );


    if (
        previewObjectUrl
    ) {

        URL.revokeObjectURL(
            previewObjectUrl
        );

        previewObjectUrl = null;

    }


    if (
        modoActual === "url"
    ) {

        const url =
            document
            .getElementById(
                "imagenUrl"
            )
            .value
            .trim();


        if (!url) {

            mostrarEstado(
                "error",
                "Ingresa una URL de imagen."
            );

            return;

        }


        imagen.src =
            url;


    } else {

        if (
            !archivoSeleccionado
        ) {

            mostrarEstado(
                "error",
                "Selecciona una imagen."
            );

            return;

        }


        previewObjectUrl =
            URL.createObjectURL(
                archivoSeleccionado
            );


        imagen.src =
            previewObjectUrl;

    }


    imagen.onerror =
        () => {

            mostrarEstado(
                "error",
                "No se pudo cargar la imagen."
            );

        };


    preview.style.display =
        "block";

}


/* =========================
   ACTUALIZAR ICONO
========================= */

async function actualizarIcono() {

    const archivoIcono =
        document
        .getElementById(
            "canal"
        )
        .value;


    const imagenUrl =
        document
        .getElementById(
            "imagenUrl"
        )
        .value
        .trim();


    const boton =
        document.getElementById(
            "updateButton"
        );


    if (!archivoIcono) {

        mostrarEstado(
            "error",
            "Selecciona un canal."
        );

        return;

    }


    if (
        modoActual === "url" &&
        !imagenUrl
    ) {

        mostrarEstado(
            "error",
            "Ingresa la URL de la imagen."
        );

        return;

    }


    if (
        modoActual === "file" &&
        !archivoSeleccionado
    ) {

        mostrarEstado(
            "error",
            "Selecciona una imagen."
        );

        return;

    }


    if (
        modoActual === "file" &&
        archivoSeleccionado.size >
        MAX_FILE_SIZE
    ) {

        mostrarEstado(
            "error",
            "La imagen supera el límite máximo de 25 MB."
        );

        return;

    }


    boton.disabled =
        true;


    boton.textContent =
        "Actualizando...";


    mostrarEstado(
        "info",
        "Procesando imagen..."
    );


    try {

        const formData =
            new FormData();


        formData.append(
            "action",
            "actualizar"
        );


        formData.append(
            "canal",
            archivoIcono
        );


        if (
            modoActual === "url"
        ) {

            formData.append(
                "imagen_url",
                imagenUrl
            );

        }


        if (
            modoActual === "file" &&
            archivoSeleccionado
        ) {

            formData.append(
                "imagen",
                archivoSeleccionado,
                archivoSeleccionado.name
            );

        }


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Authorization":
                            `Bearer ${sessionToken}`

                    },

                    body:
                        formData

                }
            );


        let data;


        try {

            data =
                await response.json();

        } catch {

            data = {};

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                `Error del servidor (${response.status})`
            );

        }


        mostrarEstado(
            "success",
            data.message ||
            "✓ Actualización iniciada correctamente."
        );


        /*
        LIMPIAR
        */

        document
            .getElementById(
                "imagenUrl"
            )
            .value =
                "";


        document
            .getElementById(
                "imagenArchivo"
            )
            .value =
                "";


        archivoSeleccionado =
            null;


        document
            .getElementById(
                "fileInfo"
            )
            .textContent =
                "Máximo 25 MB";


    } catch (error) {

        console.error(error);


        mostrarEstado(
            "error",
            error.message === "Failed to fetch"
                ? "No se pudo conectar con el servidor."
                : error.message
        );

    } finally {

        boton.disabled =
            false;


        boton.textContent =
            "Actualizar icono";

    }

}


/* =========================
   INICIO
========================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        verificarSesionGuardada();

    }
);


</script>
