<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PANEL NOVAIMG</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 30px;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.login {
    max-width: 450px;
    margin: 40px auto;
}

.panel {
    display: none;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1d4ed8;
}

.status {
    display: none;
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
}

.success {
    background: #dcfce7;
    color: #166534;
    display: block;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    display: block;
}

.preview {
    display: none;
    text-align: center;
    margin-top: 20px;
}

.preview img {
    max-width: 250px;
    max-height: 250px;
}

</style>

</head>

<body>

<header>

<div class="container">

<h1>NOVAIMG</h1>

<p>
Panel de actualización de Iconos
</p>

</div>

</header>


<!-- LOGIN -->

<div
    class="container"
    id="loginContainer"
>

<div class="card login">

<h2>Iniciar sesión</h2>

<div class="field">

<label>Usuario</label>

<input
    id="username"
    type="text"
    autocomplete="username"
>

</div>


<div class="field">

<label>Contraseña</label>

<input
    id="password"
    type="password"
    autocomplete="current-password"
>

</div>


<button onclick="iniciarSesion()">

Ingresar

</button>


<div
    id="loginStatus"
    class="status"
></div>

</div>

</div>


<!-- PANEL -->

<div
    class="container panel"
    id="panel"
>

<div class="card">

<h2>Actualizar icono</h2>


<div class="field">

<label>Canal</label>

<select id="canal">

<option value="">
Cargando canales...
</option>

</select>

</div>


<div class="field">

<label>URL de la nueva imagen</label>

<input
    id="imagenUrl"
    type="url"
    placeholder="https://ejemplo.com/logo.png"
>

</div>


<button onclick="verImagen()">

Vista previa

</button>


<div
    id="preview"
    class="preview"
>

<img id="previewImage">

</div>


<button onclick="actualizarIcono()">

Actualizar icono

</button>


<div
    id="status"
    class="status"
></div>


</div>

</div>


<script>

/*
CAMBIA ESTA URL

Por la URL de tu Supabase Edge Function
*/

const API_URL =
    "https://TU-PROYECTO.supabase.co/functions/v1/actualizar-icono";


let usuario = "";
let password = "";


/*
LOGIN
*/

async function iniciarSesion() {

    usuario =
        document
        .getElementById("username")
        .value
        .trim();


    password =
        document
        .getElementById("password")
        .value
        .trim();


    const status =
        document.getElementById(
            "loginStatus"
        );


    if (
        !usuario ||
        !password
    ) {

        status.className =
            "status error";

        status.textContent =
            "Completa usuario y contraseña.";

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login",

                            username:
                                usuario,

                            password:
                                password

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Acceso denegado"
            );

        }


        document
            .getElementById(
                "loginContainer"
            )
            .style.display =
                "none";


        document
            .getElementById(
                "panel"
            )
            .style.display =
                "block";


        cargarCanales();


    } catch (error) {

        status.className =
            "status error";

        status.textContent =
            error.message;

    }

}


/*
CARGAR CANALES DESDE EL CATÁLOGO
*/

async function cargarCanales() {

    const select =
        document.getElementById(
            "canal"
        );


    try {

        const response =
            await fetch(
                "../index.html"
            );


        const texto =
            await response.text();


        const parser =
            new DOMParser();


        const documento =
            parser.parseFromString(
                texto,
                "text/html"
            );


        const tarjetas =
            documento.querySelectorAll(
                ".card"
            );


        select.innerHTML =
            '<option value="">Selecciona un canal</option>';


        tarjetas.forEach(
            tarjeta => {

                const nombre =
                    tarjeta
                    .querySelector("h2")
                    ?.textContent
                    ?.trim();


                const numero =
                    tarjeta
                    .querySelector(
                        ".channel-number"
                    )
                    ?.textContent
                    ?.replace("CANAL", "")
                    ?.trim();


                if (
                    nombre &&
                    numero
                ) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        numero;


                    option.textContent =
                        `${nombre} (${numero})`;


                    select.appendChild(
                        option
                    );

                }

            }
        );


    } catch (error) {

        select.innerHTML =
            '<option>Error cargando canales</option>';

    }

}


/*
VISTA PREVIA
*/

function verImagen() {

    const url =
        document
        .getElementById(
            "imagenUrl"
        )
        .value
        .trim();


    if (!url) {

        alert(
            "Ingresa una URL."
        );

        return;

    }


    document
        .getElementById(
            "previewImage"
        )
        .src =
            url;


    document
        .getElementById(
            "preview"
        )
        .style.display =
            "block";

}


/*
ACTUALIZAR ICONO
*/

async function actualizarIcono() {

    const canal =
        document
        .getElementById(
            "canal"
        )
        .value;


    const imagenUrl =
        document
        .getElementById(
            "imagenUrl"
        )
        .value
        .trim();


    const status =
        document.getElementById(
            "status"
        );


    if (
        !canal ||
        !imagenUrl
    ) {

        status.className =
            "status error";

        status.textContent =
            "Completa todos los campos.";

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "actualizar",

                            username:
                                usuario,

                            password:
                                password,

                            canal:
                                canal,

                            imagen_url:
                                imagenUrl

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Error"
            );

        }


        status.className =
            "status success";

        status.textContent =
            "✓ Actualización iniciada correctamente.";


    } catch (error) {

        status.className =
            "status error";

        status.textContent =
            error.message;

    }

}

</script>

</body>
</html>
